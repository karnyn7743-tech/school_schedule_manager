
name: Create Flutter Project Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter Project
        run: |
          flutter create . \
            --project-name school_app \
            --org com.schoolcontrol \
            --platforms android,ios

      - name: Save Project Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Generate complete Flutter project"
          git push
