name: school_app
description: "تطبيق مدير دوام المدرسة - جدولة الحصص والتنبيهات وإدارة المهام."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # الأيقونات
  cupertino_icons: ^1.0.8

  # محرك التنبيهات وإدارة المناطق الزمنية
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # التخزين المحلي للبيانات
  shared_preferences: ^2.2.3

  # معالجة ملفات الإكسل (استيراد وتصدير جدول الحصص)
  excel: ^4.0.3

  # فتح مستعرض الملفات لاختيار ملف الإكسل
  file_picker: ^8.1.4

  # مشاركة ملف الإكسل المصدر عبر التطبيقات الأخرى
  share_plus: ^10.1.2

  # الوصول إلى مسارات التخزين المؤقتة والمحلية
  path_provider: ^2.1.5

  # تنسيق التواريخ والأوقات
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # مسارات الأصول والملفات الجاهزة
  assets:
    - assets/
